name: 13-02 Build Docker image with actions/cache 02

on:
  push:
    branches: [cw13]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: ./CWICZENIA/13-caching/docker02

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-docker-buildx-${{ hashFiles('CWICZENIA/13-caching/docker01/Dockerfile', 'CWICZENIA/13-caching/docker01/index.html') }}
          restore-keys: |
            ${{ runner.os }}-docker-buildx-

      - name: Build Docker image (with cached layers)
        uses: docker/build-push-action@v6
        with:
          context: ./CWICZENIA/13-caching/docker01
          file: ./CWICZENIA/13-caching/docker01/Dockerfile
          push: false
          tags: example-nginx:cache-actions-layers
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max
