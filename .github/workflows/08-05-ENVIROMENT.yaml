name: 08-05 Pogoda API — Environments

on:
  push:
    branches: [main, feature/06-pogoda-api]
  pull_request:
    branches: [main, feature/06-pogoda-api]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Repository variables (Settings → Secrets and variables → Actions → Variables):
#   WORKDIR, DOCKERHUB_USERNAME, DOCKER_IMAGE_NAME, DEPLOY_BRANCH, WEATHER_CITY
# Repository secrets: DOCKERHUB_TOKEN, OPENWEATHER_API_KEY
# Environment variables (Settings → Environments → dev / test / prod):
#   IMAGE_TAG, APP_PORT, CONTAINER_NAME, WEATHER_CITY
# Główny env widzi tylko ustawienia repozytorium. Zmienne Environment
# są odczytywane w krokach jobów, które mają przypisane `environment:`.
env:
  WORKDIR: ${{ vars.WORKDIR || './CWICZENIA/08-variables/pogoda_python_flusk' }}
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
  DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME || 'python_pogoda' }}
  TEST_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKER_IMAGE_NAME || 'python_pogoda' }}
  HUB_IMAGE_BASE: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKER_IMAGE_NAME || 'python_pogoda' }}
  CI_TAG: ci-${{ github.sha }}

jobs:
  # ===================== WSPÓLNE: build =====================
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Validate build configuration
        run: |
          for variable in WORKDIR DOCKERHUB_USERNAME DOCKER_IMAGE_NAME; do
            if [ -z "${!variable}" ]; then
              echo "::error::Brak wymaganej Repository variable: $variable"
              exit 1
            fi
          done
          echo "Obraz CI: ${TEST_IMAGE}:${CI_TAG}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CI image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.WORKDIR }}
          tags: ${{ env.TEST_IMAGE }}:${{ env.CI_TAG }}
          load: true
          push: false

      - name: Save image to tar
        run: docker save "${TEST_IMAGE}:${CI_TAG}" -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: pogoda-environments-image
          path: image.tar
          retention-days: 1

  # ===================== WSPÓLNE: test (CI, bez Environment) =====================
  test:
    runs-on: ubuntu-latest
    needs: build
    env:
      CI_CONTAINER_NAME: pogoda_api_environments_ci
      WEATHER_CITY: ${{ vars.WEATHER_CITY || 'Warsaw' }}

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: pogoda-environments-image

      - name: Load Docker image
        run: docker load -i image.tar

      - name: Run CI test container
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          if [ -z "$OPENWEATHER_API_KEY" ]; then
            echo "::error::Brak Repository secret OPENWEATHER_API_KEY."
            exit 1
          fi
          docker run -d \
            --name "$CI_CONTAINER_NAME" \
            -p 127.0.0.1:8000:8000 \
            -e OPENWEATHER_API_KEY \
            "${TEST_IMAGE}:${CI_TAG}"

      - name: Wait for CI API to be ready
        run: |
          curl --fail --silent --show-error \
            --retry 15 --retry-all-errors --retry-delay 2 \
            --retry-max-time 60 --max-time 5 \
            --output /dev/null \
            http://127.0.0.1:8000/openapi.json
          echo "API CI odpowiada."

      - name: Test /weather endpoint via curl
        run: |
          echo "Testowanie /weather dla miasta: $WEATHER_CITY"
          curl --fail --silent --show-error --max-time 30 \
            --get --data-urlencode "city=$WEATHER_CITY" \
            http://127.0.0.1:8000/weather
          echo
          echo "OK - endpoint /weather odpowiada."

      - name: Show CI container logs on failure
        if: failure()
        run: docker logs "$CI_CONTAINER_NAME" || true

      - name: Remove CI container
        if: always()
        run: docker rm --force "$CI_CONTAINER_NAME" || true

  # ===================== DEV: publikacja =====================
  build-and-push-dev:
    runs-on: ubuntu-latest
    needs: test
    environment: dev
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref_name == (vars.DEPLOY_BRANCH || 'main')
    concurrency:
      group: pogoda-env-publish-dev
      cancel-in-progress: false
    outputs:
      image_digest: ${{ steps.publish.outputs.digest }}
      image_tag: ${{ steps.config.outputs.image_tag }}

    steps:
      - name: Read and validate IMAGE_TAG (dev)
        id: config
        env:
          ENV_IMAGE_TAG: ${{ vars.IMAGE_TAG }}
          EXPECTED_IMAGE_TAG: devstaszek
        run: |
          if [ -z "$ENV_IMAGE_TAG" ]; then
            echo "::error::Brak Environment variable IMAGE_TAG w środowisku dev."
            exit 1
          fi
          if [ "$ENV_IMAGE_TAG" != "$EXPECTED_IMAGE_TAG" ]; then
            echo "::error::IMAGE_TAG w środowisku dev = '$ENV_IMAGE_TAG', oczekiwano '$EXPECTED_IMAGE_TAG'."
            exit 1
          fi
          echo "IMAGE_TAG=$ENV_IMAGE_TAG" >> "$GITHUB_ENV"
          echo "image_tag=$ENV_IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Publikuję: ${HUB_IMAGE_BASE}:${ENV_IMAGE_TAG} oraz ${HUB_IMAGE_BASE}:${ENV_IMAGE_TAG}-${GITHUB_SHA}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image (dev)
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.WORKDIR }}
          push: true
          tags: |
            ${{ env.HUB_IMAGE_BASE }}:${{ env.IMAGE_TAG }}
            ${{ env.HUB_IMAGE_BASE }}:${{ env.IMAGE_TAG }}-${{ github.sha }}

  # ===================== TEST: publikacja =====================
  build-and-push-test:
    runs-on: ubuntu-latest
    needs: test
    environment: test
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref_name == (vars.DEPLOY_BRANCH || 'main')
    concurrency:
      group: pogoda-env-publish-test
      cancel-in-progress: false
    outputs:
      image_digest: ${{ steps.publish.outputs.digest }}
      image_tag: ${{ steps.config.outputs.image_tag }}

    steps:
      - name: Read and validate IMAGE_TAG (test)
        id: config
        env:
          ENV_IMAGE_TAG: ${{ vars.IMAGE_TAG }}
          EXPECTED_IMAGE_TAG: teststaszek
        run: |
          if [ -z "$ENV_IMAGE_TAG" ]; then
            echo "::error::Brak Environment variable IMAGE_TAG w środowisku test."
            exit 1
          fi
          if [ "$ENV_IMAGE_TAG" != "$EXPECTED_IMAGE_TAG" ]; then
            echo "::error::IMAGE_TAG w środowisku test = '$ENV_IMAGE_TAG', oczekiwano '$EXPECTED_IMAGE_TAG'."
            exit 1
          fi
          echo "IMAGE_TAG=$ENV_IMAGE_TAG" >> "$GITHUB_ENV"
          echo "image_tag=$ENV_IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Publikuję: ${HUB_IMAGE_BASE}:${ENV_IMAGE_TAG} oraz ${HUB_IMAGE_BASE}:${ENV_IMAGE_TAG}-${GITHUB_SHA}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image (test)
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.WORKDIR }}
          push: true
          tags: |
            ${{ env.HUB_IMAGE_BASE }}:${{ env.IMAGE_TAG }}
            ${{ env.HUB_IMAGE_BASE }}:${{ env.IMAGE_TAG }}-${{ github.sha }}

  # ===================== PROD: publikacja =====================
  build-and-push-prod:
    runs-on: ubuntu-latest
    needs: test
    environment: prod
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref_name == (vars.DEPLOY_BRANCH || 'main')
    concurrency:
      group: pogoda-env-publish-prod
      cancel-in-progress: false
    outputs:
      image_digest: ${{ steps.publish.outputs.digest }}
      image_tag: ${{ steps.config.outputs.image_tag }}

    steps:
      - name: Read and validate IMAGE_TAG (prod)
        id: config
        env:
          ENV_IMAGE_TAG: ${{ vars.IMAGE_TAG }}
          EXPECTED_IMAGE_TAG: prodstaszek
        run: |
          if [ -z "$ENV_IMAGE_TAG" ]; then
            echo "::error::Brak Environment variable IMAGE_TAG w środowisku prod."
            exit 1
          fi
          if [ "$ENV_IMAGE_TAG" != "$EXPECTED_IMAGE_TAG" ]; then
            echo "::error::IMAGE_TAG w środowisku prod = '$ENV_IMAGE_TAG', oczekiwano '$EXPECTED_IMAGE_TAG'."
            exit 1
          fi
          echo "IMAGE_TAG=$ENV_IMAGE_TAG" >> "$GITHUB_ENV"
          echo "image_tag=$ENV_IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Publikuję: ${HUB_IMAGE_BASE}:${ENV_IMAGE_TAG} oraz ${HUB_IMAGE_BASE}:${ENV_IMAGE_TAG}-${GITHUB_SHA}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image (prod)
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.WORKDIR }}
          push: true
          tags: |
            ${{ env.HUB_IMAGE_BASE }}:${{ env.IMAGE_TAG }}
            ${{ env.HUB_IMAGE_BASE }}:${{ env.IMAGE_TAG }}-${{ github.sha }}

  # ===================== DEV: deploy (self-hosted) =====================
  deploy-dev:
    runs-on: [self-hosted, linux]
    needs: build-and-push-dev
    environment: dev
    timeout-minutes: 10
    concurrency:
      group: pogoda-env-deploy-dev
      cancel-in-progress: false
    env:
      TARGET_ENVIRONMENT: dev
      IMAGE_DIGEST: ${{ needs.build-and-push-dev.outputs.image_digest }}
      IMAGE_TAG: ${{ needs.build-and-push-dev.outputs.image_tag }}

    steps:
      - name: Read and validate deploy configuration (dev)
        env:
          ENV_APP_PORT: ${{ vars.APP_PORT }}
          ENV_CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}
          ENV_WEATHER_CITY: ${{ vars.WEATHER_CITY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          for variable in ENV_APP_PORT ENV_CONTAINER_NAME ENV_WEATHER_CITY IMAGE_DIGEST IMAGE_TAG OPENWEATHER_API_KEY; do
            if [ -z "${!variable}" ]; then
              echo "::error::Brak wymaganej konfiguracji w środowisku $TARGET_ENVIRONMENT: ${variable#ENV_}"
              exit 1
            fi
          done

          if ! [[ "$ENV_APP_PORT" =~ ^[1-9][0-9]{0,4}$ ]] || (( ENV_APP_PORT > 65535 )); then
            echo "::error::APP_PORT musi być liczbą od 1 do 65535 (jest: '$ENV_APP_PORT')."
            exit 1
          fi

          if ! [[ "$ENV_CONTAINER_NAME" =~ ^[a-zA-Z0-9][a-zA-Z0-9_-]*$ ]]; then
            echo "::error::CONTAINER_NAME musi zaczynać się literą lub cyfrą i zawierać tylko litery, cyfry, _ oraz -."
            exit 1
          fi

          {
            echo "APP_PORT=$ENV_APP_PORT"
            echo "CONTAINER_NAME=$ENV_CONTAINER_NAME"
            echo "WEATHER_CITY=$ENV_WEATHER_CITY"
            echo "API_BASE_URL=http://127.0.0.1:$ENV_APP_PORT"
          } >> "$GITHUB_ENV"

          echo "Środowisko: $TARGET_ENVIRONMENT"
          echo "Obraz:      ${HUB_IMAGE_BASE}@${IMAGE_DIGEST}"
          echo "Tag:        $IMAGE_TAG"
          echo "Port:       $ENV_APP_PORT"
          echo "Kontener:   $ENV_CONTAINER_NAME"
          echo "Miasto:     $ENV_WEATHER_CITY"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull published image by digest
        run: docker pull "${HUB_IMAGE_BASE}@${IMAGE_DIGEST}"

      - name: Remove previous dev container if it exists
        run: |
          # Nazwa została zweryfikowana wyżej, więc można jej bezpiecznie użyć w filtrze.
          existing_container="$(docker container ls --all --quiet --filter "name=^/${CONTAINER_NAME}$")"
          if [ -n "$existing_container" ]; then
            echo "Usuwam poprzedni kontener $CONTAINER_NAME ($existing_container)"
            docker rm --force "$existing_container"
          else
            echo "Brak poprzedniego kontenera $CONTAINER_NAME"
          fi

      - name: Run dev container
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            -p "${APP_PORT}:8000" \
            -e OPENWEATHER_API_KEY \
            --label "pogoda.environment=$TARGET_ENVIRONMENT" \
            --label "pogoda.image-tag=$IMAGE_TAG" \
            "${HUB_IMAGE_BASE}@${IMAGE_DIGEST}"

      - name: Verify deployed API is ready (dev)
        run: |
          curl --fail --silent --show-error \
            --retry 15 --retry-all-errors --retry-delay 2 \
            --retry-max-time 60 --max-time 5 \
            --output /dev/null \
            "$API_BASE_URL/openapi.json"
          test "$(docker inspect --format '{{.State.Running}}' "$CONTAINER_NAME")" = true
          echo "Kontener $CONTAINER_NAME działa, API odpowiada na $API_BASE_URL."

      - name: Test deployed /weather endpoint (dev)
        run: |
          echo "Testowanie $API_BASE_URL/weather dla miasta: $WEATHER_CITY"
          curl --fail --silent --show-error --max-time 30 \
            --get --data-urlencode "city=$WEATHER_CITY" \
            "$API_BASE_URL/weather"
          echo
          echo "OK - środowisko $TARGET_ENVIRONMENT odpowiada."

      - name: Show dev container logs on failure
        if: failure()
        run: docker logs "${CONTAINER_NAME:-}" || true

  # ===================== TEST: deploy (self-hosted) =====================
  deploy-test:
    runs-on: [self-hosted, linux]
    needs: build-and-push-test
    environment: test
    timeout-minutes: 10
    concurrency:
